<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Scenario Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <style>
:root {
  --bg-top: #ffffff;
  --bg-mid: #fff2f8;
  --bg-bottom: #ffdce9;
  --line: rgba(180, 0, 71, 0.33);
  --text: #1f0a15;
  --muted: #603145;
  --accent: #b40047;
  --accent-soft: #c7457b;
  --danger: #b40047;
  --positive: #1ac082;
  --shadow: 0 16px 34px rgba(121, 0, 48, 0.2);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  font-family: "Barlow", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 12% 15%, rgba(180, 0, 71, 0.15), transparent 30%),
    radial-gradient(circle at 87% 18%, rgba(212, 120, 157, 0.2), transparent 34%),
    linear-gradient(160deg, var(--bg-top), var(--bg-mid) 45%, var(--bg-bottom));
}

button {
  border: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

input,
textarea {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
  color: #fff;
  border-radius: 15px;
  padding: 0.6rem 0.8rem;
  font-family: inherit;
  font-size: 0.95rem;
}



.builder-shell {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100dvh;
}

.builder-header {
  background: #121214;
  border-bottom: 1px solid rgb(65 65 65 / 33%);
  padding: 1rem 1.2rem;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
}

.builder-header h1 {
  margin: 0;
  font-family: "Space Grotesk", sans-serif;
  font-size: 1.25rem;
}

.header-actions {
  display: flex;
  gap: 0.7rem;
  align-items: center;
  justify-content: center;
  width: 100%;
}

.scenario-name-input {
  min-width: 220px;
  text-align: center;
  background: transparent !important;
  border: none !important;
  border-bottom: 1.5px solid #8080804d !important;
  color: white;
  border-radius: 0px !important;
  }

.action-btn {
  border-radius: 8px;
  padding: 0.6rem 1rem;
  border: none;
  background: #fff;
  color: black !important;
  font-weight: 500;
}

.action-btn.primary {
  background: #5765f2;
  color: #fff;
  font-weight: 500;
}

.builder-main {
  display: block;
  position: relative;
  padding: 0;
  min-height: 0;
  overflow: hidden;
}

.chat-canvas {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 0;
  box-shadow: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(255, 239, 247, 0.97));
  overflow: hidden;
  position: absolute;
  inset: 0;
}

#builder-view {
  z-index: 1;
}

#preview-view {
  z-index: 2;
  background: #fff;
}

.blocks-container {
  overflow-y: auto;
  height: 100%;
  padding: 1rem 1rem 7rem;
  display: flex;
  flex-direction: column;
  gap: 0;
  background: #1a1a1e;
}

.block-row {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  width: 100%;
  padding: 0.25rem 0;
  border-radius: 8px;
}

.block-content {
  flex: 1;
  min-width: 0;
}

.block-tools {
  display: flex;
  flex: 0 0 32px;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  padding-top: 0.2rem;
}

.drag-handle,
.delete-btn {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: none;
  border-radius: 7px;
  background: #1a1a1e;
  color: #fff;
}

.drag-handle {
  cursor: grab;
  touch-action: none;
}

.drag-handle:active {
  cursor: grabbing;
}

.drag-handle span {
  font-size: 1.2rem;
  line-height: 0.7;
}

.delete-btn {
  cursor: pointer;
}

.delete-btn:hover {
  background: rgb(190 55 65 / 30%);
  border-color: rgb(225 90 100 / 55%);
}

.drag-handle:focus-visible,
.delete-btn:focus-visible,
.plus-toggle:focus-visible,
.insert-btn:focus-visible {
  outline: 2px solid #8791ff;
  outline-offset: 2px;
}

.block-row.dragging {
  opacity: 0.45;
}

.block-drop-preview {
  display: none;
  pointer-events: none;
}

.message-block {
  display: flex;
  gap: 0.68rem;
  align-items: flex-start;
}

.message-block.you {
  flex-direction: row-reverse;
}

.message-block.you .meta {
  justify-content: flex-end;
}

.message-block.you .msg-textarea {
  text-align: right;
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(140deg, #ffc14d, #ff7b4f);
  flex-shrink: 0;
}

.message-block.you .avatar {
  background: linear-gradient(140deg, #32d2ff, #1a7cf2);
}

.bubble-wrap {
  max-width: min(78%, 660px);
  width: 100%;
}

.meta {
  display: flex;
  gap: 0.45rem;
  align-items: center;
  margin-bottom: 0.25rem;
}

.author {
  font-size: 0.95rem;
  font-weight: 500;
  color: white;
}

.msg-textarea {
  width: 100%;
  min-height: 66px;
  resize: vertical;
  border-radius: 6px;
  border: none;
  background: #3839432e !important;
  line-height: 1.45;
}

.message-block.you .msg-textarea {
  background: rgba(180, 0, 71, 0.13);
}

.message-block.system {
  justify-content: center;
}

.message-block.system .avatar {
  display: none;
}

.message-block.system .bubble-wrap {
  max-width: 100%;
}

.message-block.system .meta {
  justify-content: center;
}

.message-block.system .author {
  display: none;
}

.message-block.system .msg-textarea {
  max-width: 600px;
  margin: 0 auto;
  display: block;
  text-align: center;
  opacity: 0.75;
  background: rgba(180, 0, 71, 0.07);
  border-color: rgba(180, 0, 71, 0.24);
}

.question-block {
  border: none;
  background: transparent;
  border-radius: 14px;
  padding: 0.8rem;
  color: #fff;
}

.question-block input {
  background: #3839432e !important;
  color: #fff;
  border-color: transparent;
  outline: none !important;
}

.question-block input::placeholder {
  color: #a7a8b2;
}

.question-title {
  margin: 0 0 0.6rem;
  font-weight: 500;
}

.option-row {
  display: grid;
  grid-template-columns: 1fr 1.2fr auto auto;
  gap: 0.5rem;
  align-items: center;
  margin-bottom: 0.5rem;
}

.option-row input[type="text"] {
  width: 100%;
}

.option-row input[type="text"]:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.correct-toggle {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: #3839432e;
  color: #bfc0c9;
}

.option-delete {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: #bfc0c9;

}

.correct-toggle {
  font-size: 1.2rem;
  line-height: 1;
}

.correct-toggle.unset {
  opacity: 0.38;
}

.correct-toggle.correct {
  opacity: 1;
  color: #7ee8bc;
  border-color: transparent;
  background: rgb(46 219 166 / 30%);
}

.correct-toggle.incorrect {
  opacity: 0.8;
  color: #d77980;
  border-color: transparent;
  background: rgb(255 106 117 / 49%);
}

.correct-toggle:focus-visible,
.option-delete:focus-visible {
  outline: transparent;
  outline-offset: 2px;
}

.option-delete:hover {
  background: rgb(190 55 65 / 20%);
}

.question-footer {
  display: flex;
  justify-content: space-between;
  gap: 0.6rem;
  flex-wrap: wrap;
}

.inline-add,
.inline-hint {
  border: none;
  background: transparent;
  padding: 0;
  font-size: 0.86rem;
  color: #fff;
}

.inline-add {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

.inline-hint {
  cursor: default;
  color: #fff;
  margin-top: 100px;
  text-align: center;
}

.insert-controls {
  display: grid;
  place-items: center;
  width: 100%;
  height: 42px;
  position: relative;
  flex: 0 0 42px;
}

.insert-controls::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 2.5px;
  border-radius: 999px;
  background: #28292d8c;
  transform: translateY(-50%);
}

.blocks-container.is-rearranging .insert-controls::before,
.blocks-container.is-rearranging .insert-controls > .plus-toggle,
.blocks-container.is-rearranging .insert-controls > .insert-menu {
  visibility: hidden;
}

.insert-controls.is-drop-target .block-drop-preview {
  position: absolute;
  z-index: 3;
  inset: 2px 0;
  min-height: 0;
  margin: 0;
  border: none;
  border-radius: 8px;
  background: rgba(72, 72, 80, 0.294);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 0.85rem;
  pointer-events: none;
}

.plus-toggle {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0px;
  border: transparent;
  border-radius: 0px;
  background: #1a1a1e;
  color: white;
}

.plus-icon {
  display: block;
  width: 16px;
  height: 16px;
  filter: brightness(0) invert(1);
}

.trash-icon {
  filter: brightness(0) saturate(100%) invert(22%) sepia(65%) saturate(2200%) hue-rotate(341deg) brightness(78%) contrast(90%);
}

.insert-menu {
  display: none;
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 50%;
  width: max-content;
  max-width: 100%;
  justify-content: center;
  align-items: center;
  transform: translate(-50%, -50%);
}

.insert-menu-inner {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  width: 100%;
}

.insert-controls.open .insert-menu {
  display: flex;
}

.insert-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  border: none;
  box-shadow: none;
  border-radius: 9px;
  background: #1a1a1e;
  color: white;
  font-weight: 500;
  padding: 0.45rem 0.7rem;
  white-space: nowrap;
}

.insert-dismiss {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 0px;
  background: #1a1a1e;
  padding: 0.4rem;
}

.dismiss-icon {
  display: block;
  width: 18px;
  height: 18px;
  filter: brightness(0) invert(1);
}



.composer-controls {
  position: absolute;
  left: 50%;
  bottom: 1rem;
  transform: translateX(-50%);
  border: 1px solid rgb(42 42 42);
  background: rgb(36 36 41);
  box-shadow: 0 10px 26px rgb(0 0 0 / 18%);
  border-radius: 14px;
  padding: 6px;
  display: flex;
  gap: 0.7rem;
  flex-wrap: wrap;
  justify-content: center;
  width: calc(100vw - 1rem);
  z-index: 2;
}

.add-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  border: 1px solid rgb(114 114 114 / 10%);
  box-shadow: 0 10px 26px rgb(0 0 0 / 18%);
  border-radius: 9px;
  background: rgb(63 64 82 / 21%);
  color: white;
  font-weight: 500;
  padding: 0.45rem 0.9rem;
  flex: 1;
}

.modal {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 1000;
  padding: 1rem;
}

.modal.hidden {
  display: none !important;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
}

.modal-content {
  position: relative;
  width: min(760px, 95vw);
  background: #1a1a1e;
  border: none;
  border-radius: 20px;
  padding: 1.2rem;
  box-shadow: var(--shadow);
  color: white;
}

.confirm-modal-content {
  width: min(420px, 95vw);
  background: #202126;
  border-color: #42434c;
  color: #fff;
}

.confirm-modal-content p {
  color: #c5c6ce;
  line-height: 1.5;
}

.confirm-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.6rem;
}

.confirm-actions .action-btn {
  background: #363740;
  color: #fff;
}

.confirm-actions .action-btn.danger {
  background: #a8323d;
  color: #fff;
}

.modal-large {
  max-height: 84vh;
  display: flex;
  flex-direction: column;
}

.modal-content h2 {
  margin: 0 0 0.8rem;
  font-family: "Space Grotesk", sans-serif;
}

.export-textarea {
  width: 100%;
  min-height: 260px;
  resize: vertical;
  margin-bottom: 0.8rem;
  font-family: "Courier New", monospace;
  font-size: 0.84rem;
  flex: 1;
  background: black !important;
  border: none !important;
}

.modal-actions {
  display: flex;
  gap: 0.6rem;
}

.modal-actions .action-btn {
  flex: 1;
}

.preview-frame {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 0;
  background: #fff;
}

.hidden {
  display: none !important;
}

@media (max-width: 840px) {
  .builder-header {
    flex-direction: column;
    align-items: stretch;
  }

  .header-actions {
    width: 100%;
    flex-wrap: wrap;
  }

  .scenario-name-input {
    flex: 1;
    min-width: 140px;
  }

  .composer-controls {
    border-radius: 14px;
    bottom: 0.7rem;
    width: calc(100vw - 1rem);
  }

  .option-row {
    grid-template-columns: 1fr;
  }

  .bubble-wrap {
    max-width: 88%;
  }

  .insert-menu-inner {
    gap: 0.35rem;
  }

  .insert-btn {
    padding: 0.4rem 0.5rem;
    font-size: 0.85rem;
  }
}
  </style>
</head>
<body>
  <div class="builder-shell">
    <header class="builder-header">
      <div class="header-actions">
        <input type="text" id="scenario-name" placeholder="Scenario name..." class="scenario-name-input" />
        <button id="preview-html-btn" class="action-btn">Preview</button>
        <button id="export-html-btn" class="action-btn primary">Export</button>
      </div>
    </header>

    <main class="builder-main">
      <section id="builder-view" class="chat-canvas" aria-label="Conversation builder">
        <div id="blocks-container" class="blocks-container"></div>

        <div class="composer-controls">
          <button id="add-user-msg-btn" class="add-btn">User</button>
          <button id="add-you-msg-btn" class="add-btn">You</button>
          <button id="add-system-msg-btn" class="add-btn">System</button>
          <button id="add-question-btn" class="add-btn">Question</button>
        </div>
      </section>
      <section id="preview-view" class="chat-canvas hidden" aria-label="Scenario preview">
        <iframe id="preview-frame" class="preview-frame" title="Scenario preview"></iframe>
      </section>
    </main>
  </div>

  <div id="export-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-large">
      <h2>Export</h2>
      <p>Copy this code and share it within the mentor channels inside of the training server where it can be accessed. Then ping @_mr_moo to have it be converted into a functional scenario for others to use.</p>
      <textarea id="export-text" class="export-textarea" readonly></textarea>
      <div class="modal-actions">
        <button id="copy-export-btn" class="action-btn primary">Copy</button>
        <button id="close-export-btn" class="action-btn">Close</button>
      </div>
    </div>
  </div>

  <div id="confirm-delete-modal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-delete-title" aria-describedby="confirm-delete-message">
    <div class="modal-backdrop"></div>
    <div class="modal-content confirm-modal-content">
      <h2 id="confirm-delete-title">Delete this block?</h2>
      <p id="confirm-delete-message">This block will be permanently removed from the scenario.</p>
      <div class="confirm-actions">
        <button id="cancel-delete-btn" class="action-btn" type="button">Cancel</button>
        <button id="confirm-delete-btn" class="action-btn danger" type="button">Delete</button>
      </div>
    </div>
  </div>

  <script>
class LiveScenarioBuilder {
  constructor() {
    this.blocks = [];
    this.uid = 0;
    this.isPreviewMode = false;
    this.pendingDeleteId = null;
    this.draggedBlockId = null;
    this.init();
  }

  init() {
    this.setupEventListeners();
    this.render();
  }

  setupEventListeners() {
    const previewBtn = document.getElementById("preview-html-btn");
    const exportBtn = document.getElementById("export-html-btn");
    const addUserBtn = document.getElementById("add-user-msg-btn");
    const addYouBtn = document.getElementById("add-you-msg-btn");
    const addSystemBtn = document.getElementById("add-system-msg-btn");
    const addQuestionBtn = document.getElementById("add-question-btn");
    const copyBtn = document.getElementById("copy-export-btn");
    const closeExportBtn = document.getElementById("close-export-btn");
    const exportBackdrop = document.querySelector("#export-modal .modal-backdrop");
    const confirmDeleteBtn = document.getElementById("confirm-delete-btn");
    const cancelDeleteBtn = document.getElementById("cancel-delete-btn");
    const confirmDeleteBackdrop = document.querySelector("#confirm-delete-modal .modal-backdrop");

    ["add-user-msg-btn", "add-you-msg-btn", "add-system-msg-btn", "add-question-btn"].forEach((id) => {
      const button = document.getElementById(id);
      const label = button.textContent.replace(/^\+\s*/, "").trim();
      button.replaceChildren(this.createPlusIcon(), document.createTextNode(label));
    });

    if (previewBtn) {
      previewBtn.addEventListener("click", () => {
        this.togglePreviewMode();
      });
    }

    if (exportBtn) {
      exportBtn.addEventListener("click", () => {
        this.showExportModal();
      });
    }

    if (addUserBtn) {
      addUserBtn.addEventListener("click", () => {
        this.addBlock("user", this.blocks.length, true);
      });
    }

    if (addYouBtn) {
      addYouBtn.addEventListener("click", () => {
        this.addBlock("you", this.blocks.length, true);
      });
    }

    if (addSystemBtn) {
      addSystemBtn.addEventListener("click", () => {
        this.addBlock("system", this.blocks.length, true);
      });
    }

    if (addQuestionBtn) {
      addQuestionBtn.addEventListener("click", () => {
        this.addBlock("question", this.blocks.length, true);
      });
    }

    if (copyBtn) {
      copyBtn.addEventListener("click", () => {
        this.copyExport();
      });
    }

    if (closeExportBtn) {
      closeExportBtn.addEventListener("click", () => {
        this.closeExportModal();
      });
    }

    if (exportBackdrop) {
      exportBackdrop.addEventListener("click", () => {
        this.closeExportModal();
      });
    }

    confirmDeleteBtn.addEventListener("click", () => {
      if (this.pendingDeleteId) {
        const index = this.blocks.findIndex((block) => block.id === this.pendingDeleteId);
        if (index !== -1) this.deleteBlock(index);
      }
      this.closeDeleteModal();
    });

    cancelDeleteBtn.addEventListener("click", () => this.closeDeleteModal());
    confirmDeleteBackdrop.addEventListener("click", () => this.closeDeleteModal());
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") this.closeDeleteModal();
    });

    const blocksContainer = document.getElementById("blocks-container");
    blocksContainer.addEventListener("dragover", (event) => {
      if (!this.draggedBlockId) return;
      event.preventDefault();
      const anchor = this.closestInsertAnchor(event.clientY);
      if (!anchor) {
        this.removeDropPreview();
        return;
      }
      this.showDropPreview(anchor);
      event.dataTransfer.dropEffect = "move";
    });

    blocksContainer.addEventListener("drop", (event) => {
      if (!this.draggedBlockId) return;
      event.preventDefault();
      const anchor = this.closestInsertAnchor(event.clientY);
      if (anchor) this.moveBlockToIndex(this.draggedBlockId, Number(anchor.dataset.insertIndex));
      this.finishRearranging();
    });
  }

  nextId(prefix) {
    this.uid += 1;
    return `${prefix}-${this.uid}`;
  }

  addBlock(type, insertAt = this.blocks.length, scrollToBottom = false) {
    const block = type === "question"
      ? {
          id: this.nextId("q"),
          type: "question",
          options: [this.createOption(), this.createOption()]
        }
      : {
          id: this.nextId("m"),
          type,
          text: ""
        };

    this.blocks.splice(insertAt, 0, block);
      this.render({ scrollToBottom });
  }

  deleteBlock(index) {
    this.blocks.splice(index, 1);
    this.render();
  }

  showDeleteModal(blockId) {
    this.pendingDeleteId = blockId;
    document.getElementById("confirm-delete-modal").classList.remove("hidden");
    document.getElementById("cancel-delete-btn").focus();
  }

  closeDeleteModal() {
    this.pendingDeleteId = null;
    document.getElementById("confirm-delete-modal").classList.add("hidden");
  }

  createOption() {
    return {
      id: this.nextId("opt"),
      label: "",
      feedback: "",
      correct: false
    };
  }

  addOption(blockIndex) {
    this.blocks[blockIndex].options.push(this.createOption());
    this.render();
  }

  deleteOption(blockIndex, optionIndex) {
    this.blocks[blockIndex].options.splice(optionIndex, 1);
    this.render();
  }

  setCorrectOption(blockIndex, optionIndex) {
    this.blocks[blockIndex].options.forEach((option, index) => {
      option.correct = index === optionIndex;
      if (option.correct) {
        option.feedback = "";
      }
    });
    this.render();
  }

  render({ scrollToBottom = false } = {}) {
    const container = document.getElementById("blocks-container");
    container.innerHTML = "";

    if (this.blocks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "inline-hint";
      empty.textContent = "Use the buttons at the bottom of your screen to get started!";
      container.appendChild(empty);
    }

    this.blocks.forEach((block, index) => {
      container.appendChild(this.renderBlockRow(block, index));

      if (index < this.blocks.length - 1) {
        container.appendChild(this.createInsertControls(index + 1));
      }
    });

    if (scrollToBottom) {
      requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
      });
    }
  }

  createInsertControls(index) {
    const controls = document.createElement("div");
    controls.className = "insert-controls";
    controls.dataset.insertIndex = String(index);

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "plus-toggle";
    toggle.appendChild(this.createPlusIcon());
    toggle.setAttribute("aria-label", "Add block");
    toggle.addEventListener("click", () => {
      controls.classList.toggle("open");
    });

    const menu = document.createElement("div");
    menu.className = "insert-menu";
    const menuInner = document.createElement("div");
    menuInner.className = "insert-menu-inner";

    menuInner.appendChild(this.makeInsertBtn("User", () => {
      this.addBlock("user", index);
    }));

    menuInner.appendChild(this.makeInsertBtn("You", () => {
      this.addBlock("you", index);
    }));

    menuInner.appendChild(this.makeInsertBtn("System", () => {
      this.addBlock("system", index);
    }));

    menuInner.appendChild(this.makeInsertBtn("Question", () => {
      this.addBlock("question", index);
    }));

    const dismiss = document.createElement("button");
    dismiss.type = "button";
    dismiss.className = "insert-dismiss";
    dismiss.setAttribute("aria-label", "Dismiss insert options");
    const dismissIcon = document.createElement("img");
    dismissIcon.className = "dismiss-icon";
    dismissIcon.src = "icons/bannerclose.svg";
    dismissIcon.alt = "";
    dismissIcon.setAttribute("aria-hidden", "true");
    dismiss.appendChild(dismissIcon);
    dismiss.addEventListener("click", () => {
      controls.classList.remove("open");
    });
    menuInner.appendChild(dismiss);
    menu.appendChild(menuInner);

    controls.appendChild(toggle);
    controls.appendChild(menu);
    return controls;
  }

  makeInsertBtn(label, onClick) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "insert-btn";
    btn.appendChild(this.createPlusIcon());
    btn.appendChild(document.createTextNode(label));
    btn.addEventListener("click", onClick);
    return btn;
  }

  createPlusIcon() {
    const icon = document.createElement("img");
    icon.className = "plus-icon";
    icon.src = "icons/Plus.svg";
    icon.alt = "";
    icon.setAttribute("aria-hidden", "true");
    return icon;
  }

  createTrashIcon() {
    const icon = document.createElement("img");
    icon.className = "plus-icon trash-icon";
    icon.src = "icons/Trash%20Icon.svg";
    icon.alt = "";
    icon.setAttribute("aria-hidden", "true");
    return icon;
  }

  renderBlockRow(block, index) {
    const container = document.getElementById("blocks-container");
    const row = document.createElement("div");
    row.className = "block-row";
    row.draggable = true;
    row.dataset.blockId = block.id;

    const tools = document.createElement("div");
    tools.className = "block-tools";

    const handle = document.createElement("button");
    handle.type = "button";
    handle.className = "drag-handle";
    handle.setAttribute("aria-label", `Drag to move ${block.type} block`);
    handle.title = "Drag to rearrange";
    handle.draggable = true;
    const grip = document.createElement("span");
    grip.textContent = "⠿";
    grip.setAttribute("aria-hidden", "true");
    handle.appendChild(grip);

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-btn";
    deleteButton.setAttribute("aria-label", "Delete block");
    deleteButton.title = "Delete block";
    deleteButton.appendChild(this.createTrashIcon());
    deleteButton.addEventListener("click", () => this.showDeleteModal(block.id));

    tools.appendChild(handle);
    tools.appendChild(deleteButton);

    const content = document.createElement("div");
    content.className = "block-content";
    content.appendChild(block.type === "question"
      ? this.renderQuestionBlock(block, index)
      : this.renderMessageBlock(block, index));

    row.appendChild(tools);
    row.appendChild(content);

    row.addEventListener("dragstart", (event) => {
      if (!event.target.closest(".drag-handle")) {
        event.preventDefault();
        return;
      }
      this.draggedBlockId = block.id;
      row.classList.add("dragging");
      container.classList.add("is-rearranging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", block.id);
    });

    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      this.finishRearranging();
    });

    return row;
  }

  closestInsertAnchor(clientY) {
    const anchors = [...document.querySelectorAll("#blocks-container .insert-controls")];
    if (anchors.length === 0) return null;
    return anchors.reduce((closest, anchor) => {
      const bounds = anchor.getBoundingClientRect();
      const distance = Math.abs(clientY - (bounds.top + bounds.height / 2));
      return !closest || distance < closest.distance
        ? { anchor, distance }
        : closest;
    }, null).anchor;
  }

  showDropPreview(anchor) {
    this.removeDropPreview();
    const sourceBlock = this.blocks.find((block) => block.id === this.draggedBlockId);
    if (!sourceBlock) return;

    const sourceIndex = this.blocks.indexOf(sourceBlock);
    const insertIndex = Number(anchor.dataset.insertIndex);
    if (insertIndex === sourceIndex || insertIndex === sourceIndex + 1) return;

    const preview = document.createElement("div");
    preview.className = "block-drop-preview";
    preview.textContent = `Move Section here`;
    preview.setAttribute("aria-hidden", "true");
    anchor.classList.add("is-drop-target");
    anchor.appendChild(preview);
  }

  removeDropPreview() {
    document.querySelectorAll(".block-drop-preview").forEach((preview) => preview.remove());
    document.querySelectorAll(".insert-controls.is-drop-target").forEach((anchor) => {
      anchor.classList.remove("is-drop-target");
    });
  }

  finishRearranging() {
    this.draggedBlockId = null;
    document.getElementById("blocks-container").classList.remove("is-rearranging");
    this.removeDropPreview();
  }

  moveBlockToIndex(sourceId, insertIndex) {
    const sourceIndex = this.blocks.findIndex((block) => block.id === sourceId);
    if (sourceIndex === -1) return;

    const [block] = this.blocks.splice(sourceIndex, 1);
    const adjustedInsertIndex = insertIndex > sourceIndex ? insertIndex - 1 : insertIndex;
    this.blocks.splice(adjustedInsertIndex, 0, block);
    this.finishRearranging();
    this.render();
  }

  renderMessageBlock(block, index) {
    const element = document.createElement("article");
    element.className = `message-block ${block.type}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const meta = document.createElement("div");
    meta.className = "meta";

    const author = document.createElement("span");
    author.className = "author";
    author.textContent = block.type === "system" ? "System" : block.type === "you" ? "You" : "User";

    const text = document.createElement("textarea");
    text.className = "msg-textarea";
    text.placeholder = block.type === "system"
      ? "System Text..."
      : block.type === "you"
      ? "Your message..."
      : "User message...";
    text.value = block.text;
    text.addEventListener("input", (e) => {
      this.blocks[index].text = e.target.value;
    });

    meta.appendChild(author);
    wrap.appendChild(meta);
    wrap.appendChild(text);

    element.appendChild(avatar);
    element.appendChild(wrap);
    return element;
  }

  renderQuestionBlock(block, blockIndex) {
    const wrapper = document.createElement("section");
    wrapper.className = "question-block";

    const title = document.createElement("p");
    title.className = "question-title";
    title.textContent = "Hurdle Question";
    wrapper.appendChild(title);

    block.options.forEach((option, optionIndex) => {
      const row = document.createElement("div");
      row.className = "option-row";

      const labelInput = document.createElement("input");
      labelInput.type = "text";
      labelInput.placeholder = "Potential Answer";
      labelInput.value = option.label;
      labelInput.addEventListener("input", (e) => {
        this.blocks[blockIndex].options[optionIndex].label = e.target.value;
      });

      const feedbackInput = document.createElement("input");
      feedbackInput.type = "text";
      feedbackInput.placeholder = option.correct ? "Correct Answer" : "Feedback for wrong answer";
      feedbackInput.value = option.feedback;
      feedbackInput.disabled = option.correct;
      feedbackInput.addEventListener("input", (e) => {
        this.blocks[blockIndex].options[optionIndex].feedback = e.target.value;
      });

      const hasCorrectOption = block.options.some((item) => item.correct);
      const correctToggle = document.createElement("button");
      correctToggle.type = "button";
      correctToggle.className = `correct-toggle ${
        option.correct ? "correct" : hasCorrectOption ? "incorrect" : "unset"
      }`;
      correctToggle.setAttribute("role", "checkbox");
      correctToggle.setAttribute("aria-checked", String(option.correct));
      correctToggle.setAttribute(
        "aria-label",
        option.correct ? "Correct answer" : "Set as correct answer"
      );
      correctToggle.title = option.correct
        ? "Correct answer"
        : hasCorrectOption
        ? "Incorrect answer"
        : "Set as correct answer";
      const stateIcon = document.createElement("img");
      stateIcon.src = option.correct || !hasCorrectOption
        ? "icons/check.svg"
        : "icons/bannerclose.svg";
      stateIcon.alt = "";
      stateIcon.setAttribute("aria-hidden", "true");
      stateIcon.className = "plus-icon";
      correctToggle.appendChild(stateIcon);
      correctToggle.addEventListener("click", () => {
        this.setCorrectOption(blockIndex, optionIndex);
      });

      const optionDelete = document.createElement("button");
      optionDelete.type = "button";
      optionDelete.className = "option-delete";
      optionDelete.setAttribute("aria-label", "Delete option");
      optionDelete.title = "Delete option";
      optionDelete.appendChild(this.createTrashIcon());
      optionDelete.addEventListener("click", () => {
        this.deleteOption(blockIndex, optionIndex);
      });

      row.appendChild(labelInput);
      row.appendChild(feedbackInput);
      row.appendChild(correctToggle);
      row.appendChild(optionDelete);
      wrapper.appendChild(row);
    });

    const footer = document.createElement("div");
    footer.className = "question-footer";

    const addOptionBtn = document.createElement("button");
    addOptionBtn.type = "button";
    addOptionBtn.className = "inline-add";
    addOptionBtn.appendChild(this.createPlusIcon());
    addOptionBtn.appendChild(document.createTextNode("Add Option"));
    addOptionBtn.addEventListener("click", () => {
      this.addOption(blockIndex);
    });

    footer.appendChild(addOptionBtn);
    wrapper.appendChild(footer);

    return wrapper;
  }

  getScenarioJSON() {
    const nodes = {};
    const startNodeId = "node-0";

    let nodeIndex = 0;
    let pendingMessages = [];

    const flushMessagesNode = (options, nextId) => {
      const nodeId = `node-${nodeIndex}`;
      nodes[nodeId] = {
        messages: pendingMessages,
        options: options.map((opt, index) => ({
          id: `option-${nodeIndex}-${index}`,
          label: opt.label.trim(),
          feedback: opt.feedback.trim(),
          correct: Boolean(opt.correct),
          next: nextId
        }))
      };
      pendingMessages = [];
      nodeIndex += 1;
    };

    this.blocks.forEach((block) => {
      if (block.type === "question") {
        const nextId = `node-${nodeIndex + 1}`;
        flushMessagesNode(block.options, nextId);
      } else {
        const text = block.text.trim();
        if (text) {
          pendingMessages.push({
            from: block.type,
            text
          });
        }
      }
    });

    const finalNodeId = `node-${nodeIndex}`;
    nodes[finalNodeId] = {
      messages: pendingMessages,
      options: []
    };

    Object.values(nodes).forEach((node) => {
      if (!node.options.length) return;
      const hasCorrect = node.options.some((opt) => opt.correct);
      if (!hasCorrect) {
        node.options[0].correct = true;
      }
      node.options.forEach((opt) => {
        if (opt.correct) {
          opt.feedback = "";
        }
      });
    });

    return {
      startNodeId,
      nodes
    };
  }

  showExportModal() {
    document.getElementById("export-modal").classList.remove("hidden");
    this.updateExportPreview();
    this.updateExportActionLabel();
  }

  closeExportModal() {
    document.getElementById("export-modal").classList.add("hidden");
  }

  togglePreviewMode() {
    const previewBtn = document.getElementById("preview-html-btn");
    const builderView = document.getElementById("builder-view");
    const previewView = document.getElementById("preview-view");

    this.isPreviewMode = !this.isPreviewMode;

    if (this.isPreviewMode) {
      this.updateInlinePreview();
      builderView.classList.add("hidden");
      previewView.classList.remove("hidden");
      if (previewBtn) previewBtn.textContent = "Edit";
      return;
    }

    builderView.classList.remove("hidden");
    previewView.classList.add("hidden");
    if (previewBtn) previewBtn.textContent = "Preview";
  }

  updateInlinePreview() {
    const scenarioName = document.getElementById("scenario-name").value.trim() || "Scenario";
    const content = this.generateHTML(scenarioName);
    const frame = document.getElementById("preview-frame");
    if (frame) {
      frame.srcdoc = content;
    }
  }

  updateExportPreview() {
    const scenarioName = document.getElementById("scenario-name").value.trim() || "Scenario";
    const content = this.generateHTML(scenarioName);
    document.getElementById("export-text").value = content;
  }

  updateExportActionLabel() {
    const copyBtn = document.getElementById("copy-export-btn");
    if (!copyBtn) return;
    copyBtn.textContent = this.isMobileDevice() && navigator.share ? "Share" : "Copy";
  }

  isMobileDevice() {
    return window.matchMedia("(pointer: coarse)").matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

    <script>
      const scenario = ${scenarioJSON};
      const splashScreen = document.getElementById("splash-screen");
      const chatScreen = document.getElementById("chat-screen");
      const beginBtn = document.getElementById("begin-btn");
      const restartBtn = document.getElementById("restart-btn");
      const scenarioTitleEl = document.getElementById("scenario-title");
      const channelNameEl = document.getElementById("channel-name");
      const chatLog = document.getElementById("chat-log");
      const choicesEl = document.getElementById("choices");
      const messageTemplate = document.getElementById("message-template");
      const wrongAnswerModal = document.getElementById("wrong-answer-modal");
      const modalCloseBtn = document.getElementById("modal-close-btn");
      const modalBackdrop = wrongAnswerModal.querySelector(".modal-backdrop");
      if (scenarioTitleEl && channelNameEl) {
        channelNameEl.textContent = scenarioTitleEl.textContent || "Scenario";
      }
      let pendingNodeToken = 0;
      const MESSAGE_GAP_MS = 1000;
      const USER_TYPING_MS = 850;
      const YOU_TYPING_MS = 850;
      function wait(ms) { return new Promise((resolve) => window.setTimeout(resolve, ms)); }
      function getTimeStamp() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
      function pushMessage({ text, from = "user", isSystem = false }) {
        const fragment = messageTemplate.content.cloneNode(true);
        const message = fragment.querySelector(".message");
        const authorEl = fragment.querySelector(".author");
        const timeEl = fragment.querySelector(".time");
        const bubbleEl = fragment.querySelector(".bubble");
        const previousMessage = [...chatLog.children].reverse().find((item) =>
          item.classList.contains("message") && !item.classList.contains("typing")
        );
        if (
          !isSystem &&
          previousMessage?.classList.contains("message") &&
          !previousMessage.classList.contains("system") &&
          previousMessage.dataset.sender === from
        ) {
          bubbleEl.classList.add("continuation");
          bubbleEl.textContent = text;
          previousMessage.querySelector(".bubble-wrap").appendChild(bubbleEl);
          chatLog.scrollTop = chatLog.scrollHeight;
          return;
        }
        message.dataset.sender = from;
        if (
          !isSystem &&
          previousMessage &&
          !previousMessage.classList.contains("system") &&
          previousMessage.dataset.sender !== from
        ) {
          message.classList.add("sender-change");
        }
        if (from === "you") {
          message.classList.add("you");
        }
        if (isSystem) {
          message.classList.add("system");
        }
        authorEl.textContent = from === "you" ? "You" : "User";
        bubbleEl.textContent = text;
        timeEl.textContent = getTimeStamp();
        chatLog.appendChild(fragment);
        chatLog.scrollTop = chatLog.scrollHeight;
      }
      function showTypingIndicator({ author, from = "user" }) {
        const wrapper = document.createElement("article");
        wrapper.className = "message typing";
        wrapper.dataset.sender = from;
        const previousMessage = [...chatLog.children].reverse().find((item) =>
          item.classList.contains("message") && !item.classList.contains("typing")
        );
        if (
          previousMessage?.classList.contains("message") &&
          !previousMessage.classList.contains("system") &&
          previousMessage.dataset.sender === from
        ) {
          wrapper.classList.add("continuation");
        }
        if (from === "you") {
          wrapper.classList.add("you");
        }
        wrapper.innerHTML = '<div class="avatar"></div><div class="bubble-wrap"><div class="meta"><span class="author"></span><span class="time">typing...</span></div><div class="bubble" aria-label="typing indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>';
        if (
          previousMessage &&
          !previousMessage.classList.contains("system") &&
          previousMessage.dataset.sender !== from
        ) {
          wrapper.classList.add("sender-change");
        }
        wrapper.querySelector(".author").textContent = author;
        chatLog.appendChild(wrapper);
        chatLog.scrollTop = chatLog.scrollHeight;
        return wrapper;
      }
      function showWrongAnswerModal(feedback) {
        document.getElementById("feedback-text").textContent = feedback || "Try a different option.";
        wrongAnswerModal.classList.remove("hidden");
      }
      function hideWrongAnswerModal() { wrongAnswerModal.classList.add("hidden"); }
      function renderOptions(node) {
        choicesEl.innerHTML = "";
        if (!node.options || node.options.length === 0) {
          const done = document.createElement("p");
          done.className = "channel-subtitle";
          done.textContent = "Scenario complete.";
          choicesEl.appendChild(done);
          requestAnimationFrame(() => {
            chatLog.scrollTop = chatLog.scrollHeight;
          });
          return;
        }
        node.options.forEach((option) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice-btn";
          btn.textContent = option.label;
          btn.addEventListener("click", () => handleChoice(option, btn));
          choicesEl.appendChild(btn);
        });
        requestAnimationFrame(() => {
          chatLog.scrollTop = chatLog.scrollHeight;
        });
      }
      async function goToNode(nodeId) {
        const node = scenario.nodes[nodeId];
        if (!node) return;
        const myToken = ++pendingNodeToken;
        choicesEl.innerHTML = "";
        for (const [index, item] of (node.messages || []).entries()) {
          if (myToken !== pendingNodeToken) return;
          if (index > 0) {
            await wait(MESSAGE_GAP_MS);
            if (myToken !== pendingNodeToken) return;
          }
          const from = item.from || "user";
          const text = item.text || "";
          const isSystem = from === "system";
          if (!isSystem) {
            const typing = showTypingIndicator({
              author: from === "you" ? "You" : "User",
              from
            });
            await wait(from === "you" ? YOU_TYPING_MS : USER_TYPING_MS);
            if (myToken !== pendingNodeToken) {
              typing.remove();
              return;
            }
            typing.remove();
          }
          pushMessage({ text, from, isSystem });
        }
        renderOptions(node);
      }
      async function handleChoice(option, clickedBtn) {
        const buttons = Array.from(choicesEl.querySelectorAll(".choice-btn"));
        buttons.forEach((btn) => (btn.disabled = true));
        clickedBtn.classList.add(option.correct ? "correct" : "wrong");
        if (!option.correct) {
          showWrongAnswerModal(option.feedback);
          return;
        }
        await wait(250);
        void goToNode(option.next);
      }
      function startScenario() {
        splashScreen.classList.add("hidden");
        chatScreen.classList.remove("hidden");
        pendingNodeToken += 1;
        chatLog.innerHTML = "";
        void goToNode(scenario.startNodeId);
      }
      function handleModalClose() {
        hideWrongAnswerModal();
        const buttons = Array.from(choicesEl.querySelectorAll(".choice-btn"));
        buttons.forEach((btn) => (btn.disabled = false));
      }
      beginBtn.addEventListener("click", startScenario);
      restartBtn.addEventListener("click", startScenario);
      modalCloseBtn.addEventListener("click", handleModalClose);
      modalBackdrop.addEventListener("click", handleModalClose);
    <\/script>
  </body>
</html>`;
  }

  async copyExport() {
    if (this.isMobileDevice() && navigator.share) {
      const shared = await this.shareExport();
      if (shared) return;
    }

    const text = document.getElementById("export-text").value;

    if (navigator.clipboard && window.ClipboardItem) {
      const blob = new Blob([text], { type: "text/plain" });
      try {
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/plain": blob
          })
        ]);
        this.flashExportButton("Copied!");
        return;
      } catch (error) {
        this.copyExportFallback(text);
        this.flashExportButton("Copied!");
        return;
      }
    }

    this.copyExportFallback(text);
    this.flashExportButton("Copied!");
  }

  async shareExport() {
    const text = document.getElementById("export-text").value;
    const scenarioName = document.getElementById("scenario-name").value.trim() || "scenario";
    const safeScenarioName = scenarioName.replace(/[^a-z0-9-_ ]/gi, "").trim() || "scenario";
    const filename = `${safeScenarioName}.txt`;
    const file = new File([text], filename, { type: "text/plain" });

    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: safeScenarioName,
          text: `${safeScenarioName} export`,
          files: [file]
        });
      } else {
        await navigator.share({
          title: safeScenarioName,
          text
        });
      }
      this.flashExportButton("Shared!");
      return true;
    } catch (error) {
      if (error && error.name === "AbortError") {
        return true;
      }
      return false;
    }
  }

  flashExportButton(label) {
    const copyBtn = document.getElementById("copy-export-btn");
    if (!copyBtn) return;

    const defaultLabel = this.isMobileDevice() && navigator.share ? "Share" : "Copy";
    copyBtn.textContent = label;
    window.setTimeout(() => {
      copyBtn.textContent = defaultLabel;
    }, 1200);
  }

  copyExportFallback(text) {
    const textArea = document.getElementById("export-text");
    textArea.focus();
    textArea.select();
    document.execCommand("copy");
    textArea.setSelectionRange(0, 0);
  }
}

const builder = new LiveScenarioBuilder();
